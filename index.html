  <script type="module">
    console.log('[Push Init] Starting push notification setup...');
    
    import { registerAndSubscribePush, isPushSupported } from './push.js';
    
    console.log('[Push Init] Module imported successfully');
    
    // Function to register push notifications
    async function initPushNotifications() {
      console.log('[Push Init] initPushNotifications called');
      
      if (!isPushSupported()) {
        console.log('[Push Init] Push notifications not supported on this browser');
        return;
      }
      
      console.log('[Push Init] Push is supported, registering...');
      
      const url = window.SUPABASE_URL;
      const anon = window.SUPABASE_ANON;
      const userId = null; // Will be set by Flutter after auth
      
      console.log('[Push Init] Supabase URL:', url);
      
      try {
        const result = await registerAndSubscribePush(url, anon, userId);
        console.log('[Push Init] Registration result:', result);
      } catch (e) {
        console.error('[Push Init] Registration error:', e);
      }
    }
    
    // Register on first user interaction (required by some browsers)
    let pushInitialized = false;
    function tryInitPush() {
      console.log('[Push Init] tryInitPush called, initialized:', pushInitialized);
      if (!pushInitialized) {
        pushInitialized = true;
        initPushNotifications();
      }
    }
    
    // Make it available globally for manual testing
    window.testPushRegistration = initPushNotifications;
    
    // Try to register after page load and on first interaction
    window.addEventListener('load', () => {
      console.log('[Push Init] Page loaded, waiting 2s...');
      // Delay slightly to let Flutter initialize
      setTimeout(tryInitPush, 2000);
    });
    
    // Also register on first user interaction (handles stricter browsers)
    document.addEventListener('click', tryInitPush, { once: true });
    document.addEventListener('touchstart', tryInitPush, { once: true });
  </script>
